name: Feature request
description: Request a change to Framelift.
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: What should Framelift do?
      description: Describe what you need and why.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Include your Mac, display or network if relevant.
