name: Bug report
description: Report a problem with Framelift.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the error message, if any.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Framelift version or commit
      description: See Framelift › About Framelift.
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and macOS version
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Include the game, display, connection, and changed settings if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: If available, attach a zip from Settings › Debug › Export Logs… Review it before posting.
