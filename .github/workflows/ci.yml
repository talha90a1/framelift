name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "licenses/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/RELEASE_NOTES.md"
      - ".editorconfig"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check public history
        run: |
          if [ -n "$(git log --full-history --format=%h HEAD -- ':(icase,glob)**/agents.md' ':(icase,glob)**/claude.md')" ]; then
            echo "::error::Private instruction file in commit history"
            exit 1
          fi

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"

      # build_chiaki.sh installs these too; Package.swift also needs the openssl@3 headers on cache hits.
      - name: Install Homebrew dependencies
        run: brew install cmake protobuf miniupnpc libevent json-c opus openssl@3

      - name: Restore libchiaki build
        id: chiaki-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/chiaki-dist
          key: chiaki-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_chiaki.sh', 'scripts/patches/**') }}

      - name: Build libchiaki
        if: steps.chiaki-cache.outputs.cache-hit != 'true'
        run: scripts/build_chiaki.sh

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

  lint:
    # Advisory: shows swift-format warnings for the Swift files a pull request changes, without failing.
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: swift-format lint (changed files)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          FILES=$(git diff --name-only --diff-filter=AM "origin/$BASE_REF...HEAD" -- '*.swift')
          if [ -z "$FILES" ]; then echo "No Swift files changed."; exit 0; fi
          printf '%s\n' "$FILES" | xargs -I '{}' xcrun swift-format lint --configuration .swift-format '{}' 2>&1 \
            | sed -E 's#^([^:]+):([0-9]+):([0-9]+): warning: (.*)#::warning file=\1,line=\2,col=\3::\4#'
