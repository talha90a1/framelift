name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check release tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          if ! grep -qF 'static let enabledByDefault = false' Sources/Framelift/Shared/Diagnostics.swift; then
            echo "::error::Turn off Debug logs by default before releasing"
            exit 1
          fi
          scripts/release_notes.sh "$version" > "$RUNNER_TEMP/release-notes.md"

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install Homebrew dependencies
        run: brew install cmake protobuf miniupnpc libevent json-c opus openssl@3

      - name: Build libchiaki
        run: scripts/build_chiaki.sh

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/release.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Build release zip
        run: scripts/release.sh

      - name: Package corresponding source
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          scripts/release_source.py "${GITHUB_REF_NAME#v}"
          cp "$RUNNER_TEMP/release-notes.md" dist/

      - name: Write appcast
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/updates"
          cp "dist/Framelift-$version-macOS-arm64.zip" "$RUNNER_TEMP/updates/"
          scripts/release_notes.sh --changes "$version" > "$RUNNER_TEMP/updates/Framelift-$version-macOS-arm64.md"
          echo "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - --embed-release-notes \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            -o dist/appcast.xml "$RUNNER_TEMP/updates"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Framelift-release
          path: |
            dist/Framelift-*-macOS-arm64.zip
            dist/Framelift-*-macOS-arm64.zip.sha256
            dist/Framelift-*-source.tar.gz
            dist/release-notes.md
            dist/appcast.xml
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Framelift-release
          path: dist

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/Framelift-*-macOS-arm64.zip
            dist/Framelift-*-source.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Framelift-*-macOS-arm64.zip dist/Framelift-*-macOS-arm64.zip.sha256 \
            dist/Framelift-*-source.tar.gz dist/appcast.xml --verify-tag --title "Framelift ${GITHUB_REF_NAME#v}" \
            --notes-file dist/release-notes.md
